name: PR Review Bot (Universal)

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.d.outputs.node }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          echo "node=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$([ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  node_checks:
    name: Node checks
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
        continue-on-error: true
      - run: npm run build --if-present
        continue-on-error: true
      - run: npx --yes eslint . 2>/dev/null || echo "no eslint config"
        continue-on-error: true
      - run: npm test --if-present
        continue-on-error: true

  python_checks:
    name: Python checks
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt --quiet 2>/dev/null || pip install -e . --quiet 2>/dev/null || echo "no installable deps"
        continue-on-error: true
      - run: python -m pytest -q 2>/dev/null || echo "no pytest suite"
        continue-on-error: true
        env:
          TESTING: 'true'

  constitution:
    name: Constitution checks
    runs-on: ubuntu-latest
    outputs:
      fails: ${{ steps.c.outputs.fails }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        run: |
          BASE="origin/${{ github.base_ref }}"
          DIFF_ADDED=$(git diff "$BASE"...HEAD | grep "^+" | grep -v "^+++")
          FAILS=""
          if echo "$DIFF_ADDED" | grep -E "console\.(log|debug|info)" | grep -v "console.error"; then
            FAILS="${FAILS}console-statements;"
          fi
          if echo "$DIFF_ADDED" | grep "dangerouslySetInnerHTML"; then
            FAILS="${FAILS}dangerous-html;"
          fi
          if git diff "$BASE"...HEAD --name-only | grep "\.py$" | grep -v -i "test" | xargs -r git diff "$BASE"...HEAD -- | grep "^+" | grep -E "\bprint\("; then
            FAILS="${FAILS}print-statements;"
          fi
          if echo "$DIFF_ADDED" | grep -Ei "sk-[a-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY|xox[bap]-"; then
            FAILS="${FAILS}hardcoded-secrets;"
          fi
          CHANGED=$(git diff "$BASE"...HEAD --name-only | wc -l)
          echo "changed_files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "fails=${FAILS}" >> "$GITHUB_OUTPUT"
          [ -z "$FAILS" ]

  report:
    name: Post review
    needs: [detect, node_checks, python_checks, constitution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ok = (v) => v === 'success' ? '✅' : (v === 'skipped' ? '➖' : '❌');
            const node = '${{ needs.detect.outputs.node }}' === 'true';
            const python = '${{ needs.detect.outputs.python }}' === 'true';
            const lines = ['## 🤖 PR Review Bot', ''];
            if (node) lines.push(`${ok('${{ needs.node_checks.result }}')} Node: install / build / lint / test`);
            if (python) lines.push(`${ok('${{ needs.python_checks.result }}')} Python: install / pytest`);
            if (!node && !python) lines.push('➖ No Node or Python project detected — ran constitution checks only.');
            const cfails = '${{ needs.constitution.outputs.fails }}';
            lines.push(`${cfails ? '❌' : '✅'} Constitution: no console.log/print, no dangerouslySetInnerHTML, no hardcoded secrets` + (cfails ? ` _(failed: ${cfails})_` : ''));
            lines.push('', `_Files changed: ${{ needs.constitution.outputs.changed_files }}_`);
            const allOk = ['${{ needs.node_checks.result }}', '${{ needs.python_checks.result }}', '${{ needs.constitution.result }}'].every(r => r === 'success' || r === 'skipped');
            lines.push('', allOk ? 'All checks green — safe to review for merge.' : 'Fix the ❌ items above, then re-request review.');
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: lines.join('\n'),
            });

  ai_review:
    name: AI review (optional)
    needs: [report]
    runs-on: ubuntu-latest
    # NOTE: the `secrets` context is NOT allowed in jobs.<job>.if — GitHub
    # rejects the entire workflow file and zero jobs run. Gate on env instead.
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate review
        if: ${{ env.AI_API_KEY != '' }}
        run: |
          BASE="origin/${{ github.base_ref }}"
          DIFF=$(git diff "$BASE"...HEAD | head -c 60000)
          PROMPT="You are reviewing a pull request. Be terse, no fluff. List concrete issues with file:line, ordered by severity (P0 blocking, P1 major, P2 minor). Cover: bugs, security issues (auth, injection, secrets), and broken patterns. If clean, say so in one line.

          DIFF:
          $DIFF"
          REVIEW=$(curl -s "${AI_BASE_URL:-https://api.openai.com/v1}/chat/completions" \
            -H "Authorization: Bearer $AI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg m "${AI_MODEL:-gpt-4o-mini}" --arg p "$PROMPT" \
              '{model:$m, messages:[{role:"user", content:$p}], max_tokens:1500}')")
          echo "$REVIEW" | jq -r '.choices[0].message.content // "AI review unavailable"' > /tmp/ai_review.md
        env:
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
      - name: Post AI review
        if: ${{ env.AI_API_KEY != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/ai_review.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: `## 🤖 AI Review\n\n${review}`,
            });